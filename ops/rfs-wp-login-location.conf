# APPLIED 2026-09-18 to /etc/nginx/sites-available/rfsupplements.com, inserted
# immediately above `location ~ \.php$` so this one file matches here first.
# Kept in the repo because that vhost is not otherwise version controlled.
#
# A backup of the pre-change vhost is at
# /etc/nginx/sites-available/rfsupplements.com.bak-20260918-2308

location = /wp-login.php {
    limit_req zone=rfs_wp_login burst=3 nodelay;
    limit_req_status 429;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-rfs.sock;
    fastcgi_read_timeout 300s;
}
