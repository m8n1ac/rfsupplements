# Rate limiting for the WordPress login, for /etc/nginx/conf.d/.
#
# The store vhost already blocks xmlrpc, protects wp-config, denies PHP in
# uploads and drops headless checkout POSTs. wp-login.php had nothing, while
# wp-json/wp/v2/users was handing out administrator login names — the pair is a
# ready-made credential-stuffing target. The enumeration half is closed by the
# rfs-hardening mu-plugin; this is the other half.
#
# 5 requests/minute per IP with a burst of 3. A human signing in uses one. A
# password sprayer needs thousands, and gets 503s instead.
limit_req_zone $binary_remote_addr zone=rfs_wp_login:10m rate=5r/m;
