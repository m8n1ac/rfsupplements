# Rate limiting for the WordPress login, for /etc/nginx/conf.d/.
#
# Two mistakes are deliberately designed out here:
#
# 1. Counting page loads. A sign-in is a GET for the form plus a POST to submit,
#    and a mistyped password doubles it. The first version limited every request
#    at 5/min and locked real users out with a 429 that looks like a broken site.
#    Only POST is counted now: an empty key skips limiting entirely.
#
# 2. Too tight. 30/minute per IP with a burst of 10 — a person cannot type
#    credentials that fast, and a shared office IP with several staff signing in
#    at once is nowhere near it. A password sprayer needs thousands.
#
# NOTE: changing the zone key requires `systemctl restart nginx`, not reload.
map $request_method $rfs_login_limit_key {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $rfs_login_limit_key zone=rfs_wp_login:10m rate=30r/m;
