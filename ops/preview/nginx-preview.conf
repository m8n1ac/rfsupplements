# ==================== preview.rfsupplements.com ====================
# Scrubbed staging copy of the store. Password-walled, never indexed.
# Must not affect rfsupplements.com or rfsrx.com.

server {
    listen 80;
    listen [::]:80;
    server_name preview.rfsupplements.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name preview.rfsupplements.com;

    # Placeholder until certbot issues a real certificate for this host.
    ssl_certificate     /etc/letsencrypt/live/rfsupplements.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rfsupplements.com/privkey.pem;
    include snippets/rfs-ssl.conf;

    root /var/www/preview.rfsupplements.com;
    index index.php index.html;

    access_log /var/log/nginx/preview.access.log;
    error_log  /var/log/nginx/preview.error.log warn;

    # Nothing is reachable without the shared password — including by crawlers,
    # scrapers, and anyone who guesses the hostname.
    auth_basic           "RF Supplements preview";
    auth_basic_user_file /etc/nginx/.htpasswd-preview;

    # Belt and braces with the mu-plugin's meta tag.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 256M;

    include snippets/rfs-wp-security.conf;

    location / { try_files $uri $uri/ /index.php?$args; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-preview.sock;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff2?|ttf|eot|mp4|webm|pdf)$ {
        expires 7d;
        access_log off;
    }
}
