; preview.rfsupplements.com — a scrubbed staging copy of the store.
; Its own user and socket, so it can never read or write the live site's files.
; Smaller worker pool than production: this box has 2 vCPUs and the live store
; must always win under contention.
[preview]
user = rfspv
group = rfspv
listen = /run/php/php8.3-fpm-preview.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 300
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.3-fpm.preview.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[post_max_size] = 256M
php_admin_value[max_input_vars] = 5000
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
